<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>仕入カウント確認アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col select-none">

  <!-- ヘッダー -->
  <header class="bg-slate-900 text-white px-4 py-3 shadow-md flex items-center justify-between shrink-0">
    <div class="flex items-center gap-2">
      <span class="text-xl">📦</span>
      <h1 class="text-sm font-black tracking-wider">仕入カウント確認アプリ</h1>
    </div>
    <div class="flex items-center gap-1.5">
      <button onclick="openPLListModal()" class="px-2.5 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold active:scale-95 flex items-center gap-1 shadow">
        <span>📂 取込PL一覧</span>
      </button>
      <button onclick="openSettingsModal()" class="p-1.5 rounded-xl bg-slate-800 text-slate-300 hover:text-white border border-slate-700 active:scale-95" title="設定">
        ⚙️
      </button>
    </div>
  </header>

  <!-- メインコンテンツ領域 -->
  <main class="flex-1 flex flex-col overflow-hidden relative">

    <!-- VIEW 1: PL入力画面（メイン） -->
    <div id="view-pl-entry" class="flex-1 flex flex-col justify-between p-4 pb-safe overflow-y-auto">
      <div class="space-y-3">
        <div class="bg-white border border-slate-200 rounded-2xl p-3.5 shadow-sm space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-700">📌 マスタ・データ同期</span>
            <span id="card-master-count" class="text-[11px] text-emerald-700 font-mono font-bold">マスタ読込中...</span>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="fetchMasterFromGas(false)" class="py-2.5 px-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold shadow active:scale-95 transition-all flex items-center justify-center gap-1">
              <span>⟳ 商品マスタ更新</span>
            </button>
            <button onclick="refreshPLDataFromGas(false)" class="py-2.5 px-3 bg-sky-600 hover:bg-sky-500 text-white rounded-xl text-xs font-bold shadow active:scale-95 transition-all flex items-center justify-center gap-1">
              <span>⟳ PLデータ取込</span>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between px-1">
          <span class="text-xs font-bold text-slate-600">本日の進捗サマリー</span>
          <button onclick="openPLListModal()" class="text-xs text-sky-600 font-bold hover:underline">全リスト表示 ➔</button>
        </div>
        <div id="pl-dashboard-grid" class="grid grid-cols-3 gap-2"></div>
      </div>

      <!-- テンキー入力エリア -->
      <div class="my-auto py-4 max-w-sm mx-auto w-full">
        <div class="text-center mb-2">
          <span class="text-xs font-bold text-slate-600 uppercase tracking-widest block">
            検品するPL番号をテンキー入力
          </span>
          <div class="mt-1.5 h-16 bg-white border-2 border-slate-300 rounded-2xl flex items-center justify-center px-4 shadow-sm">
            <span id="pl-keypad-display" class="text-3xl font-black font-mono tracking-widest text-slate-400">
              PL番号を入力
            </span>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <button onclick="pressPlKeypad('1')" class="h-14 bg-white hover:bg-slate-100 active:bg-slate-200 rounded-2xl text-2xl font-black text-slate-800 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">1</button>
          <button onclick="pressPlKeypad('2')" class="h-14 bg-white hover:bg-slate-100 active:bg-slate-200 rounded-2xl text-2xl font-black text-slate-800 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">2</button>
          <button onclick="pressPlKeypad('3')" class="h-14 bg-white hover:bg-slate-100 active:bg-slate-200 rounded-2xl text-2xl font-black text-slate-800 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">3</button>
          <button onclick="pressPlKeypad('4')" class="h-14 bg-white hover:bg-slate-100 active:bg-slate-200 rounded-2xl text-2xl font-black text-slate-800 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">4</button>
          <button onclick="pressPlKeypad('5')" class="h-14 bg-white hover:bg-slate-100 active:bg-slate-200 rounded-2xl text-2xl font-black text-slate-800 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">5</button>
          <button onclick="pressPlKeypad('6')" class="h-14 bg-white hover:bg-slate-100 active:bg-slate-200 rounded-2xl text-2xl font-black text-slate-800 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">6</button>
          <button onclick="pressPlKeypad('7')" class="h-14 bg-white hover:bg-slate-100 active:bg-slate-200 rounded-2xl text-2xl font-black text-slate-800 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">7</button>
          <button onclick="pressPlKeypad('8')" class="h-14 bg-white hover:bg-slate-100 active:bg-slate-200 rounded-2xl text-2xl font-black text-slate-800 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">8</button>
          <button onclick="pressPlKeypad('9')" class="h-14 bg-white hover:bg-slate-100 active:bg-slate-200 rounded-2xl text-2xl font-black text-slate-800 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">9</button>
          <button onclick="clearPlKeypad()" class="h-14 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 rounded-2xl text-xs font-black text-rose-600 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">C</button>
          <button onclick="pressPlKeypad('0')" class="h-14 bg-white hover:bg-slate-100 active:bg-slate-200 rounded-2xl text-2xl font-black text-slate-800 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">0</button>
          <button onclick="backspacePlKeypad()" class="h-14 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 rounded-2xl text-sm font-bold text-slate-700 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">⌫</button>
        </div>

        <button onclick="confirmPlKeypad()" class="w-full mt-3.5 h-14 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] text-white font-black text-base rounded-2xl shadow-md flex items-center justify-center gap-2 transition-all">
          <span>PL番号を確定して検品開始</span>
          <span>➔</span>
        </button>
      </div>
    </div>

    <!-- VIEW 2: 検品画面（商品名・カラー・サイズを必ず表示） -->
    <div id="view-inspecting" class="flex-1 flex flex-col justify-between overflow-hidden hidden">
      <div class="px-4 py-2.5 bg-white border-b border-slate-200 flex items-center justify-between text-xs shadow-sm">
        <div>
          <span class="text-[11px] text-slate-500 block">対象PL</span>
          <span id="inspect-pl-label" class="font-mono font-black text-slate-900 text-base">PL -</span>
        </div>
        <button onclick="backToPlEntry()" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-bold text-slate-700">PL選択に戻る</button>
      </div>

      <div id="inspection-cards-container" class="flex-1 overflow-y-auto p-3.5 space-y-3"></div>

      <div class="p-3.5 bg-white border-t border-slate-200 pb-safe shadow-lg">
        <button id="btn-goto-confirm" onclick="goToConfirmScreen()" disabled class="w-full py-4 rounded-2xl font-black text-base flex items-center justify-center gap-2 transition-all shadow-md bg-slate-200 text-slate-400 cursor-not-allowed">
          <span>送信前の最終確認プレビューへ</span>
          <span>➔</span>
        </button>
      </div>
    </div>

    <!-- VIEW 3: 最終確認プレビュー画面 -->
    <div id="view-confirm" class="flex-1 flex flex-col justify-between overflow-hidden hidden">
      <div class="p-3.5 bg-white border-b border-slate-200 flex items-center justify-between shadow-sm">
        <div>
          <h3 class="text-sm font-bold text-slate-900">送信前 最終確認リスト</h3>
          <p id="confirm-pl-sub" class="text-xs text-slate-500">PL の検品結果</p>
        </div>
        <button onclick="backToInspectionScreen()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-bold text-slate-700">修正に戻る</button>
      </div>

      <div id="confirm-items-container" class="flex-1 overflow-y-auto p-3.5 space-y-2.5"></div>

      <div class="p-3.5 bg-white border-t border-slate-200 pb-safe space-y-2 shadow-lg">
        <div class="flex items-center gap-2">
          <label class="text-xs font-bold text-slate-700 shrink-0">作業責任者:</label>
          <input type="text" id="inspector-name-input" value="伊尾" class="flex-1 px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold bg-slate-50">
        </div>
        <button onclick="submitInspectionData()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-base rounded-2xl shadow-md active:scale-98 transition-all">
          検品結果をスプレッドシートに送信・保存 🚀
        </button>
      </div>
    </div>

  </main>

  <!-- 取込済みPLデータ一覧モーダル -->
  <div id="modal-pl-list" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl flex flex-col max-h-[85vh] overflow-hidden">
      <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
        <h3 class="font-bold text-sm flex items-center gap-2"><span>📂</span> 取込済みPLデータ一覧</h3>
        <button onclick="closePLListModal()" class="text-slate-400 hover:text-white text-lg font-bold px-2">✕</button>
      </div>
      <div class="p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between gap-2">
        <span class="text-xs text-slate-600 font-bold">バックエンドから同期されたPLリスト</span>
        <button onclick="refreshPLDataFromGas(true)" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold rounded-xl shadow active:scale-95">⟳ リスト更新</button>
      </div>
      <div id="pl-list-modal-body" class="p-4 overflow-y-auto flex-1 space-y-2.5"></div>
      <div class="p-3 bg-white border-t border-slate-200 flex justify-end">
        <button onclick="closePLListModal()" class="px-5 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-xs rounded-xl">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 差異詳細入力モーダル -->
  <div id="modal-discrepancy" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
      <div class="p-4 bg-amber-600 text-white flex items-center justify-between">
        <h3 class="font-bold text-sm">⚠️ 差異・例外項目の詳細登録</h3>
        <button onclick="closeDiscrepancyModal()" class="text-amber-200 hover:text-white text-lg font-bold">✕</button>
      </div>
      <div class="p-4 overflow-y-auto space-y-4 flex-1">
        <div>
          <label class="text-xs font-bold text-slate-700 block mb-1">差異の理由を選択:</label>
          <select id="disc-reason-select" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold bg-white">
            <option value="数量過不足">数量過不足 (超過/不足)</option>
            <option value="商品違い">商品違い (異なる商品が混入)</option>
            <option value="サイズ違い">サイズ違い</option>
            <option value="カラー違い">カラー違い</option>
            <option value="欠品・破損">欠品・破損</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-bold text-slate-700 block mb-1">実数 または 数量:</label>
          <input type="number" id="disc-qty-input" class="w-full px-3 py-2 border border-slate-300 rounded-xl font-mono text-sm font-bold" value="0">
        </div>

        <div>
          <label class="text-xs font-bold text-slate-700 block mb-1">対象商品コード (商品違い/混入の場合):</label>
          <input type="text" id="disc-target-code" placeholder="例: 610722211" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-mono">
        </div>

        <div>
          <label class="text-xs font-bold text-slate-700 block mb-1">備考メモ:</label>
          <input type="text" id="disc-note-input" placeholder="例: カートン破損あり など" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs">
        </div>
      </div>
      <div class="p-3 bg-white border-t border-slate-200 flex justify-end gap-2">
        <button onclick="closeDiscrepancyModal()" class="px-4 py-2 bg-slate-200 text-slate-800 font-bold text-xs rounded-xl">キャンセル</button>
        <button onclick="saveDiscrepancyEntry()" class="px-5 py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs rounded-xl">差異を登録する</button>
      </div>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div id="modal-settings" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl p-5 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="font-black text-sm text-slate-900">⚙️ アプリ設定</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-700 font-bold">✕</button>
      </div>
      <div>
        <label class="text-xs font-bold text-slate-700 block mb-1">GAS Web App URL:</label>
        <input type="text" id="settings-gas-url" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-mono" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <button onclick="saveSettings()" class="w-full py-3 bg-slate-900 text-white font-bold text-xs rounded-xl shadow">設定を保存</button>
    </div>
  </div>

  <!-- JavaScript制御ロジック -->
  <script>
    let state = {
      gasUrl: localStorage.getItem('gas_url') || '',
      currentView: 'view-pl-entry',
      plKeypadVal: '',
      activePlNo: null,
      plList: [],
      masterList: [],
      currentPlItems: [],
      inspectionResults: {},
      activeDiscIndex: null
    };

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('settings-gas-url').value = state.gasUrl;
      if (state.gasUrl) {
        fetchAllData();
      } else {
        openSettingsModal();
      }
    });

    function switchView(viewId) {
      ['view-pl-entry', 'view-inspecting', 'view-confirm'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(viewId).classList.remove('hidden');
      state.currentView = viewId;
    }

    function openSettingsModal() { document.getElementById('modal-settings').classList.remove('hidden'); }
    function closeSettingsModal() { document.getElementById('modal-settings').classList.add('hidden'); }
    function saveSettings() {
      state.gasUrl = document.getElementById('settings-gas-url').value.trim();
      localStorage.setItem('gas_url', state.gasUrl);
      closeSettingsModal();
      fetchAllData();
    }

    function openPLListModal() {
      document.getElementById('modal-pl-list').classList.remove('hidden');
      renderPLModalList();
    }
    function closePLListModal() { document.getElementById('modal-pl-list').classList.add('hidden'); }

    async function fetchAllData() {
      if (!state.gasUrl) return;
      await fetchMasterFromGas(true);
      await refreshPLDataFromGas(true);
    }

    async function fetchMasterFromGas(silent) {
      try {
        const res = await fetch(`${state.gasUrl}?action=getMaster`);
        const json = await res.json();
        if (json.status === 'success') {
          state.masterList = json.data || [];
          document.getElementById('card-master-count').innerText = `マスタ ${state.masterList.length}件連携中`;
          if (!silent) alert(`商品マスタを更新しました（${state.masterList.length}件）`);
        }
      } catch (err) {
        if (!silent) alert('マスタ取得エラー: ' + err.message);
      }
    }

    async function refreshPLDataFromGas(silent) {
      try {
        const res = await fetch(`${state.gasUrl}?action=refreshPLData`);
        const json = await res.json();
        if (json.status === 'success') {
          state.plList = json.data || [];
          renderPLDashboard();
          if (!document.getElementById('modal-pl-list').classList.contains('hidden')) {
            renderPLModalList();
          }
          if (!silent) alert(`PLデータを反映しました（${state.plList.length}件）`);
        }
      } catch (err) {
        if (!silent) alert('PLデータ取得エラー: ' + err.message);
      }
    }

    function renderPLDashboard() {
      const grid = document.getElementById('pl-dashboard-grid');
      if (state.plList.length === 0) {
        grid.innerHTML = '<div class="col-span-3 text-center py-3 text-xs text-slate-400 bg-white rounded-xl border border-slate-200">PLデータ未取込</div>';
        return;
      }
      let html = '';
      state.plList.forEach(pl => {
        const badge = pl.isCompleted 
          ? '<span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.5 rounded">検品済</span>'
          : '<span class="text-[10px] bg-amber-100 text-amber-800 font-bold px-1.5 py-0.5 rounded">未検品</span>';
        html += `
          <button onclick="selectPlNo('${pl.plNo}')" class="p-2.5 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl text-left shadow-sm transition-all active:scale-95 flex flex-col justify-between">
            <div class="flex items-center justify-between w-full">
              <span class="font-mono font-black text-slate-900 text-sm">PL:${pl.plNo}</span>
              ${badge}
            </div>
            <div class="text-[11px] text-slate-500 mt-1">${pl.totalLines}品目 / ${pl.totalPlanQty}個</div>
          </button>
        `;
      });
      grid.innerHTML = html;
    }

    function renderPLModalList() {
      const body = document.getElementById('pl-list-modal-body');
      if (state.plList.length === 0) {
        body.innerHTML = '<div class="text-center py-8 text-xs text-slate-400">取込済みのPLデータがありません</div>';
        return;
      }
      let html = '';
      state.plList.forEach(pl => {
        const badge = pl.isCompleted ? '<span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded font-bold text-xs">検品済</span>' : '<span class="px-2 py-0.5 bg-amber-100 text-amber-800 rounded font-bold text-xs">未検品</span>';
        html += `
          <div class="p-3.5 bg-white border border-slate-200 rounded-2xl flex items-center justify-between shadow-sm">
            <div>
              <div class="font-black text-base text-slate-900">PL番号: ${pl.plNo}</div>
              <div class="text-xs text-slate-500 mt-0.5">品目数: ${pl.totalLines}行 / 予定総数: ${pl.totalPlanQty}個</div>
            </div>
            <div class="flex items-center gap-2">
              ${badge}
              <button onclick="closePLListModal(); selectPlNo('${pl.plNo}');" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl active:scale-95">検品する</button>
            </div>
          </div>
        `;
      });
      body.innerHTML = html;
    }

    // テンキー
    function pressPlKeypad(n) {
      if (state.plKeypadVal.length >= 5) return;
      state.plKeypadVal += n;
      updateKeypadDisplay();
    }
    function clearPlKeypad() { state.plKeypadVal = ''; updateKeypadDisplay(); }
    function backspacePlKeypad() { state.plKeypadVal = state.plKeypadVal.slice(0, -1); updateKeypadDisplay(); }
    function updateKeypadDisplay() {
      const el = document.getElementById('pl-keypad-display');
      if (state.plKeypadVal === '') {
        el.innerText = 'PL番号を入力';
        el.className = 'text-3xl font-black font-mono tracking-widest text-slate-400';
      } else {
        el.innerText = state.plKeypadVal;
        el.className = 'text-3xl font-black font-mono tracking-widest text-emerald-700';
      }
    }
    function confirmPlKeypad() {
      if (!state.plKeypadVal) { alert('PL番号を入力してください'); return; }
      selectPlNo(state.plKeypadVal);
    }

    async function selectPlNo(plNo) {
      state.activePlNo = plNo;
      try {
        const res = await fetch(`${state.gasUrl}?action=getPLDetails&plNo=${plNo}`);
        const json = await res.json();
        if (json.status === 'success' && json.data.length > 0) {
          state.currentPlItems = json.data;
          state.inspectionResults = {};
          state.currentPlItems.forEach((item, idx) => {
            state.inspectionResults[idx] = { actualQty: item.planQty, hasException: false, discrepancies: [] };
          });
          document.getElementById('inspect-pl-label').innerText = `PL - ${plNo}`;
          renderInspectionCards();
          switchView('view-inspecting');
        } else {
          alert(`PL番号「${plNo}」のデータが見つかりません。`);
        }
      } catch (err) {
        alert('通信エラー: ' + err.message);
      }
    }

    function backToPlEntry() { switchView('view-pl-entry'); }

    // 検品カード描画
    function renderInspectionCards() {
      const container = document.getElementById('inspection-cards-container');
      let html = '';
      state.currentPlItems.forEach((item, idx) => {
        const res = state.inspectionResults[idx];
        const isEx = res.hasException;
        const discSummary = (res.discrepancies || []).map(d => `${d.reason}: ${d.qty}点`).join(' / ');

        html += `
          <div class="bg-white border-2 ${isEx ? 'border-amber-400 bg-amber-50/20' : 'border-slate-200'} rounded-2xl p-4 shadow-sm space-y-3">
            <div class="flex items-start justify-between gap-2">
              <div>
                <span class="px-2 py-0.5 bg-slate-100 text-slate-700 rounded font-mono text-[11px] font-bold">${item.itemCode || 'コードなし'}</span>
                <h4 class="text-base font-black text-slate-900 mt-1">${item.jpDesign || item.mexDesign}</h4>
                <div class="text-xs font-bold text-slate-600 mt-1">
                  カラー: <span class="text-slate-900 font-black">${item.jpColor || item.mexColor}</span> ｜ 
                  サイズ: <span class="text-slate-900 font-black">${item.jpSize || item.mexSize}</span>
                </div>
              </div>
              <div class="text-right shrink-0">
                <span class="text-[10px] text-slate-500 block">予定数</span>
                <span class="text-xl font-black font-mono text-slate-900">${item.planQty}</span>
              </div>
            </div>

            <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
              <button onclick="setInspectionMatch(${idx})" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition-all ${!isEx ? 'bg-emerald-600 text-white shadow' : 'bg-slate-100 text-slate-700'}">
                ✓ 予定通り一致 (${item.planQty})
              </button>
              <button onclick="openDiscrepancyModal(${idx})" class="px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${isEx ? 'bg-amber-600 text-white shadow' : 'bg-amber-50 text-amber-800 border border-amber-300'}">
                ⚠️ 差異あり ${res.discrepancies.length > 0 ? '('+res.discrepancies.length+')' : ''}
              </button>
            </div>

            ${isEx ? `
              <div class="p-2.5 bg-amber-100/70 border border-amber-300 rounded-xl text-xs space-y-1">
                <div class="font-bold text-amber-900">登録された差異:</div>
                <div class="text-amber-800 font-mono">${discSummary || '差異詳細が未登録です'}</div>
              </div>
            ` : ''}
          </div>
        `;
      });
      container.innerHTML = html;
      checkInspectionCompletion();
    }

    function setInspectionMatch(idx) {
      state.inspectionResults[idx].actualQty = state.currentPlItems[idx].planQty;
      state.inspectionResults[idx].hasException = false;
      state.inspectionResults[idx].discrepancies = [];
      renderInspectionCards();
    }

    // 差異モーダルを開く
    function openDiscrepancyModal(idx) {
      state.activeDiscIndex = idx;
      const item = state.currentPlItems[idx];
      document.getElementById('disc-qty-input').value = item.planQty;
      document.getElementById('disc-target-code').value = '';
      document.getElementById('disc-note-input').value = '';
      document.getElementById('modal-discrepancy').classList.remove('hidden');
    }

    function closeDiscrepancyModal() {
      document.getElementById('modal-discrepancy').classList.add('hidden');
      state.activeDiscIndex = null;
    }

    function saveDiscrepancyEntry() {
      const idx = state.activeDiscIndex;
      if (idx === null) return;
      const reason = document.getElementById('disc-reason-select').value;
      const qty = Number(document.getElementById('disc-qty-input').value) || 0;
      const targetCode = document.getElementById('disc-target-code').value.trim();
      const note = document.getElementById('disc-note-input').value.trim();

      state.inspectionResults[idx].hasException = true;
      state.inspectionResults[idx].actualQty = qty;
      state.inspectionResults[idx].discrepancies.push({
        reason: reason,
        qty: qty,
        targetItemCode: targetCode,
        note: note
      });

      closeDiscrepancyModal();
      renderInspectionCards();
    }

    function checkInspectionCompletion() {
      const btn = document.getElementById('btn-goto-confirm');
      btn.disabled = false;
      btn.className = 'w-full py-4 rounded-2xl font-black text-base flex items-center justify-center gap-2 transition-all shadow-md bg-emerald-600 hover:bg-emerald-500 text-white active:scale-[0.98]';
    }

    function goToConfirmScreen() {
      document.getElementById('confirm-pl-sub').innerText = `PL - ${state.activePlNo} の検品結果`;
      const container = document.getElementById('confirm-items-container');
      let html = '';
      state.currentPlItems.forEach((item, idx) => {
        const res = state.inspectionResults[idx];
        html += `
          <div class="bg-white border border-slate-200 rounded-2xl p-3 shadow-sm space-y-1 text-xs">
            <div class="flex items-center justify-between">
              <span class="font-mono text-slate-500">${item.itemCode || 'コードなし'}</span>
              <span class="font-bold ${res.hasException ? 'text-amber-600' : 'text-emerald-600'}">${res.hasException ? '⚠️ 差異あり' : '✓ 一致'}</span>
            </div>
            <div class="font-black text-slate-900 text-sm">${item.jpDesign || item.mexDesign}</div>
            <div class="text-slate-600">カラー: <strong class="text-slate-900">${item.jpColor || item.mexColor}</strong> ｜ サイズ: <strong class="text-slate-900">${item.jpSize || item.mexSize}</strong></div>
            <div class="flex justify-between font-mono pt-1 border-t border-slate-100 mt-1">
              <span>予定: ${item.planQty}</span>
              <span class="font-bold text-emerald-700">実数: ${res.actualQty}</span>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
      switchView('view-confirm');
    }

    function backToInspectionScreen() { switchView('view-inspecting'); }

    async function submitInspectionData() {
      const inspectorName = document.getElementById('inspector-name-input').value.trim() || '未記入';
      const payload = {
        action: 'submitInspection',
        plNo: state.activePlNo,
        inspectorName: inspectorName,
        items: state.currentPlItems.map((item, idx) => ({
          itemCode: item.itemCode,
          mexDesign: item.mexDesign,
          mexColor: item.mexColor,
          mexSize: item.mexSize,
          jpDesign: item.jpDesign,
          jpColor: item.jpColor,
          jpSize: item.jpSize,
          planQty: item.planQty,
          actualQty: state.inspectionResults[idx].actualQty,
          hasException: state.inspectionResults[idx].hasException,
          discrepancies: state.inspectionResults[idx].discrepancies
        }))
      };

      try {
        const res = await fetch(state.gasUrl, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (json.status === 'success') {
          alert('検品データを保存し、差異確認シートを更新しました！');
          switchView('view-pl-entry');
          refreshPLDataFromGas(true);
        } else {
          alert('保存エラー: ' + json.message);
        }
      } catch (err) {
        alert('送信エラー: ' + err.message);
      }
    }
  </script>
</body>
</html>
