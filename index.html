<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>仕入カウント確認報告 - メキシコ便入荷検品</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }
    input, textarea {
      user-select: text;
    }
    .pb-safe {
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col font-sans antialiased">

  <!-- オフライン・電波状況バナー -->
  <div id="offline-banner" class="hidden bg-amber-500 text-slate-950 px-3 py-1 text-center text-xs font-bold flex items-center justify-center gap-1 shadow z-50">
    <span>⚠️ 電波が不安定です（データは一時保存されます）</span>
  </div>

  <!-- ヘッダー -->
  <header class="sticky top-0 z-40 bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <div id="header-back-btn" onclick="goToStep('pl_select')" class="hidden p-2 rounded-xl bg-slate-100 text-slate-700 active:scale-95 cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      </div>
      <div>
        <h1 class="text-xs font-bold text-slate-900">仕入カウント確認報告</h1>
        <div class="text-[11px] text-slate-500 flex items-center gap-1 mt-0.5">
          <span onclick="openWorkerModal()" class="text-emerald-700 font-bold cursor-pointer hover:underline" id="header-worker-label">作業者: 山田 太郎 ✎</span>
          <span id="header-pl-info" class="hidden font-mono font-bold text-amber-700">· PL: -</span>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="refreshData()" class="px-2.5 py-1.5 bg-sky-50 text-sky-800 border border-sky-300 rounded-xl text-xs font-bold active:scale-95">⟳ 更新</button>
      <button onclick="openSettingsModal()" class="p-2 bg-slate-100 text-slate-700 border border-slate-300 rounded-xl text-xs active:scale-95" title="設定">⚙️</button>
    </div>
  </header>

  <!-- メインコンテンツ (ステップ切替式) -->
  <main class="flex-1 flex flex-col p-4 max-w-md mx-auto w-full justify-between overflow-y-auto">

    <!-- ==========================================
         STEP 1: PL選択画面 ＆ テンキー入力
         ========================================== -->
    <div id="step-pl_select" class="flex-1 flex flex-col justify-between space-y-4">
      <div>
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-xs font-bold text-slate-700 uppercase tracking-wider">📦 未検品PL一覧</h2>
          <button onclick="openImporterModal()" class="text-xs text-sky-700 font-bold hover:underline">＋ PL取込ガイド</button>
        </div>
        <div id="pl-list-container" class="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto pr-1">
          <!-- 動的生成 -->
        </div>
      </div>

      <div class="bg-white border border-slate-200 rounded-3xl p-4 shadow-sm space-y-3 my-auto">
        <div class="text-center">
          <span class="text-xs font-bold text-slate-500 block">PL番号をテンキーで入力</span>
          <div id="pl-keypad-display" class="mt-1 h-16 bg-slate-50 border-2 border-slate-300 rounded-2xl flex items-center justify-center text-3xl font-black font-mono tracking-widest text-slate-400">
            PL番号
          </div>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="pressPlKey('1')" class="h-14 bg-slate-50 hover:bg-slate-100 rounded-2xl text-2xl font-black border border-slate-200 active:scale-95">1</button>
          <button onclick="pressPlKey('2')" class="h-14 bg-slate-50 hover:bg-slate-100 rounded-2xl text-2xl font-black border border-slate-200 active:scale-95">2</button>
          <button onclick="pressPlKey('3')" class="h-14 bg-slate-50 hover:bg-slate-100 rounded-2xl text-2xl font-black border border-slate-200 active:scale-95">3</button>
          <button onclick="pressPlKey('4')" class="h-14 bg-slate-50 hover:bg-slate-100 rounded-2xl text-2xl font-black border border-slate-200 active:scale-95">4</button>
          <button onclick="pressPlKey('5')" class="h-14 bg-slate-50 hover:bg-slate-100 rounded-2xl text-2xl font-black border border-slate-200 active:scale-95">5</button>
          <button onclick="pressPlKey('6')" class="h-14 bg-slate-50 hover:bg-slate-100 rounded-2xl text-2xl font-black border border-slate-200 active:scale-95">6</button>
          <button onclick="pressPlKey('7')" class="h-14 bg-slate-50 hover:bg-slate-100 rounded-2xl text-2xl font-black border border-slate-200 active:scale-95">7</button>
          <button onclick="pressPlKey('8')" class="h-14 bg-slate-50 hover:bg-slate-100 rounded-2xl text-2xl font-black border border-slate-200 active:scale-95">8</button>
          <button onclick="pressPlKey('9')" class="h-14 bg-slate-50 hover:bg-slate-100 rounded-2xl text-2xl font-black border border-slate-200 active:scale-95">9</button>
          <button onclick="clearPlKey()" class="h-14 bg-rose-50 text-rose-600 rounded-2xl text-xs font-bold border border-rose-200 active:scale-95">クリア</button>
          <button onclick="pressPlKey('0')" class="h-14 bg-slate-50 hover:bg-slate-100 rounded-2xl text-2xl font-black border border-slate-200 active:scale-95">0</button>
          <button onclick="backspacePlKey()" class="h-14 bg-slate-100 text-slate-700 rounded-2xl text-sm font-bold border border-slate-200 active:scale-95">⌫ 戻る</button>
        </div>
        <button onclick="confirmPlInput()" class="w-full h-14 bg-emerald-600 text-white font-black rounded-2xl shadow-md text-base active:scale-98">
          PL番号を確定して検品開始 ➔
        </button>
      </div>
    </div>


    <!-- ==========================================
         STEP 2: 商品ごとのカウント数入力画面 (大きく表示)
         ========================================== -->
    <div id="step-counting" class="hidden flex-1 flex flex-col justify-between space-y-4">
      <div class="bg-white border border-slate-200 rounded-3xl p-5 shadow-sm space-y-4">
        <div class="flex items-center justify-between border-b border-slate-100 pb-2">
          <span id="count-item-index" class="text-xs font-bold text-slate-400 font-mono">品目 1 / 5</span>
          <span id="count-pl-badge" class="px-2 py-0.5 bg-amber-100 text-amber-800 text-xs font-mono font-bold rounded-lg">PL: -</span>
        </div>

        <!-- 大きな商品情報表示 -->
        <div class="space-y-2 text-center py-2">
          <div id="count-item-code" class="inline-block px-3 py-1 bg-slate-100 font-mono text-xs font-bold text-slate-700 rounded-lg">
            --
          </div>
          <h2 id="count-item-name" class="text-2xl font-black text-slate-900 leading-tight">
            商品名ロード中...
          </h2>
          <div class="flex items-center justify-center gap-3 text-sm font-bold pt-1">
            <span class="text-slate-600">カラー: <strong id="count-item-color" class="text-slate-900">-</strong></span>
            <span>·</span>
            <span class="text-amber-800 text-base">サイズ: <strong id="count-item-size" class="text-amber-900">-</strong></span>
          </div>
        </div>

        <!-- 予定数 ＆ カウント数入力表示 -->
        <div class="grid grid-cols-2 gap-3 pt-2">
          <div class="p-3 bg-slate-50 border border-slate-200 rounded-2xl text-center">
            <span class="text-xs font-bold text-slate-500 block">入荷予定数</span>
            <span id="count-plan-qty" class="text-3xl font-black font-mono text-slate-800">0</span>
          </div>
          <div class="p-3 bg-amber-50 border-2 border-amber-400 rounded-2xl text-center shadow-inner">
            <span class="text-xs font-bold text-amber-800 block">カウント実数</span>
            <span id="count-actual-qty-display" class="text-3xl font-black font-mono text-amber-900">-</span>
          </div>
        </div>
      </div>

      <!-- 大きなテンキー（カウント用） -->
      <div class="bg-white border border-slate-200 rounded-3xl p-4 shadow-sm space-y-3">
        <div class="grid grid-cols-3 gap-2">
          <button onclick="pressCountKey('1')" class="h-12 bg-slate-50 hover:bg-slate-100 rounded-xl text-xl font-black border border-slate-200 active:scale-95">1</button>
          <button onclick="pressCountKey('2')" class="h-12 bg-slate-50 hover:bg-slate-100 rounded-xl text-xl font-black border border-slate-200 active:scale-95">2</button>
          <button onclick="pressCountKey('3')" class="h-12 bg-slate-50 hover:bg-slate-100 rounded-xl text-xl font-black border border-slate-200 active:scale-95">3</button>
          <button onclick="pressCountKey('4')" class="h-12 bg-slate-50 hover:bg-slate-100 rounded-xl text-xl font-black border border-slate-200 active:scale-95">4</button>
          <button onclick="pressCountKey('5')" class="h-12 bg-slate-50 hover:bg-slate-100 rounded-xl text-xl font-black border border-slate-200 active:scale-95">5</button>
          <button onclick="pressCountKey('6')" class="h-12 bg-slate-50 hover:bg-slate-100 rounded-xl text-xl font-black border border-slate-200 active:scale-95">6</button>
          <button onclick="pressCountKey('7')" class="h-12 bg-slate-50 hover:bg-slate-100 rounded-xl text-xl font-black border border-slate-200 active:scale-95">7</button>
          <button onclick="pressCountKey('8')" class="h-12 bg-slate-50 hover:bg-slate-100 rounded-xl text-xl font-black border border-slate-200 active:scale-95">8</button>
          <button onclick="pressCountKey('9')" class="h-12 bg-slate-50 hover:bg-slate-100 rounded-xl text-xl font-black border border-slate-200 active:scale-95">9</button>
          <button onclick="clearCountKey()" class="h-12 bg-rose-50 text-rose-600 rounded-xl text-xs font-bold border border-rose-200 active:scale-95">クリア</button>
          <button onclick="pressCountKey('0')" class="h-12 bg-slate-50 hover:bg-slate-100 rounded-xl text-xl font-black border border-slate-200 active:scale-95">0</button>
          <button onclick="backspaceCountKey()" class="h-12 bg-slate-100 text-slate-700 rounded-xl text-sm font-bold border border-slate-200 active:scale-95">⌫</button>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-1">
          <button onclick="submitExactMatch()" class="py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-sm rounded-2xl shadow active:scale-98">
            ✓ 予定通り一致 (OK)
          </button>
          <button onclick="proceedFromCounting()" class="py-3 bg-amber-600 hover:bg-amber-500 text-white font-black text-sm rounded-2xl shadow active:scale-98">
            差異あり・次へ ➔
          </button>
        </div>
      </div>
    </div>


    <!-- ==========================================
         STEP 3: 差異の要因選択画面 (3つのボタン)
         ========================================== -->
    <div id="step-discrepancy_type" class="hidden flex-1 flex flex-col justify-between space-y-4 my-auto">
      <div class="bg-white border border-amber-300 rounded-3xl p-5 shadow-sm space-y-4 text-center">
        <span class="text-3xl">⚠️</span>
        <h2 class="text-base font-black text-slate-900">差異の要因を選択してください</h2>
        <p class="text-xs text-slate-500">予定数と異なる理由、または例外をタップ</p>

        <div class="space-y-3 pt-2">
          <button onclick="selectDiscrepancyType('数量過不足')" class="w-full py-4 bg-slate-50 hover:bg-slate-100 border-2 border-slate-300 rounded-2xl font-black text-base text-slate-800 active:scale-98 flex items-center justify-center gap-2">
            <span>📦 数量過不足 (数だけ違う)</span>
          </button>
          <button onclick="selectDiscrepancyType('サイズ違い')" class="w-full py-4 bg-purple-50 hover:bg-purple-100 border-2 border-purple-400 rounded-2xl font-black text-base text-purple-900 active:scale-98 flex items-center justify-center gap-2">
            <span>🏷️ サイズ違い (別サイズが混入)</span>
          </button>
          <button onclick="selectDiscrepancyType('商品違い')" class="w-full py-4 bg-rose-50 hover:bg-rose-100 border-2 border-rose-400 rounded-2xl font-black text-base text-rose-900 active:scale-98 flex items-center justify-center gap-2">
            <span>🔀 商品違い (まったく別の商品)</span>
          </button>
        </div>
      </div>
      <button onclick="goToStep('counting')" class="w-full py-3 bg-slate-200 text-slate-700 font-bold text-xs rounded-2xl">
        ◀ カウント入力に戻る
      </button>
    </div>


    <!-- ==========================================
         STEP 4: 商品検索・選択画面 (サイズ違い・商品違い用)
         ========================================== -->
    <div id="step-master_search" class="hidden flex-1 flex flex-col space-y-3">
      <div class="bg-white border border-blue-200 rounded-3xl p-4 shadow-sm flex-1 flex flex-col">
        <div class="flex items-center justify-between pb-2 border-b border-slate-200 mb-2">
          <h3 class="text-xs font-bold text-slate-900">🔍 正しい商品マスタを検索・選択</h3>
          <button onclick="goToStep('discrepancy_type')" class="text-xs text-slate-400 font-bold">✕ 戻る</button>
        </div>

        <input type="text" id="master-search-input" oninput="filterMaster(this.value)" placeholder="品名、商品コード、サイズで検索..." class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-xs font-medium mb-3 focus:outline-none focus:border-blue-500">

        <div class="flex-1 overflow-y-auto space-y-2 pr-1" id="master-search-results">
          <!-- 動的生成 -->
        </div>
      </div>
    </div>


    <!-- ==========================================
         STEP 5: 確認 ＆ 送信完了画面
         ========================================== -->
    <div id="step-confirm" class="hidden flex-1 flex flex-col justify-between space-y-4">
      <div class="bg-white border border-slate-200 rounded-3xl p-4 shadow-sm flex-1 flex flex-col">
        <div class="pb-2 border-b border-slate-200 mb-3 flex items-center justify-between">
          <div>
            <h3 class="text-xs font-bold text-slate-900">📋 送信前 最終確認リスト</h3>
            <p id="confirm-pl-label" class="text-[11px] font-mono text-amber-700 font-bold">PL: -</p>
          </div>
          <button onclick="goToStep('counting')" class="px-2.5 py-1 bg-slate-100 rounded-xl text-xs font-bold text-slate-700">修正する</button>
        </div>

        <div id="confirm-items-container" class="flex-1 overflow-y-auto space-y-2 pr-1">
          <!-- 動的生成 -->
        </div>

        <div class="mt-3 pt-3 border-t border-slate-200 bg-slate-50 p-3 rounded-2xl flex items-center justify-between">
          <span class="text-xs font-bold text-slate-700">合計カウント数 (実績総計):</span>
          <span id="confirm-total-actual" class="font-black font-mono text-emerald-700 text-base">0 点</span>
        </div>
      </div>

      <button onclick="submitInspectionData()" id="btn-final-submit" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-2xl shadow-md text-base active:scale-98">
        検品結果を送信して完了する ➔
      </button>
    </div>

  </main>


  <!-- MODAL: 設定モーダル -->
  <div id="modal-settings" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-white border border-slate-200 rounded-3xl p-5 max-w-sm w-full shadow-2xl space-y-3">
      <div class="flex items-center justify-between border-b border-slate-200 pb-2">
        <h3 class="text-xs font-bold text-slate-900">⚙️ GAS連携設定</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 text-sm">✕</button>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">GAS Web App URL</label>
        <input type="url" id="setting-gas-url" placeholder="https://script.google.com/macros/s/.../exec" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-[10px] font-mono">
      </div>
      <button onclick="saveSettings()" class="w-full py-3 bg-emerald-600 text-white font-bold text-xs rounded-xl shadow">保存する</button>
    </div>
  </div>

  <!-- MODAL: 作業者名変更 -->
  <div id="modal-worker" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-white border border-slate-200 rounded-2xl p-4 max-w-sm w-full shadow-xl space-y-3">
      <h3 class="text-xs font-bold text-slate-900">作業者氏名の変更</h3>
      <input type="text" id="worker-quick-input" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold">
      <div class="flex gap-2">
        <button onclick="closeWorkerModal()" class="flex-1 py-2.5 bg-slate-100 text-slate-700 text-xs font-bold rounded-xl">キャンセル</button>
        <button onclick="saveWorkerQuick()" class="flex-1 py-2.5 bg-emerald-600 text-white font-bold text-xs rounded-xl">保存</button>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="fixed top-14 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl text-xs font-bold text-white shadow-xl transition-all duration-300 opacity-0 -translate-y-2 bg-emerald-600 pointer-events-none"></div>


  <!-- JavaScript 制御ロジック -->
  <script>
    let masterList = [];
    let plProgress = [];
    let currentPLItems = [];
    let currentIndex = 0;

    let state = {
      workerName: localStorage.getItem('inspection_worker') || '山田 太郎',
      gasUrl: localStorage.getItem('inspection_gas_url') || '',
      currentStep: 'pl_select',
      plKeypadBuffer: '',
      countKeypadBuffer: '',
      selectedPL: '',
      selectedDiscrepancyType: '',
      activeDiscrepancies: []
    };

    document.addEventListener('DOMContentLoaded', async () => {
      updateHeader();
      loadLocalMaster();
      if (state.gasUrl) {
        await fetchMasterFromGas(true);
        await refreshPLData(true);
      }
      renderPLList();
    });

    function updateHeader() {
      document.getElementById('header-worker-label').textContent = `作業者: ${state.workerName} ✎`;
      document.getElementById('setting-gas-url').value = state.gasUrl;
      document.getElementById('worker-quick-input').value = state.workerName;
    }

    function loadLocalMaster() {
      try {
        const saved = localStorage.getItem('inspection_master_items');
        if (saved) masterList = JSON.parse(saved);
      } catch (e) {}
    }

    async function fetchMasterFromGas(isSilent = false) {
      if (!state.gasUrl) return;
      try {
        const res = await fetch(`${state.gasUrl}?action=getMaster`);
        const json = await res.json();
        if (json.status === 'success' && Array.isArray(json.data)) {
          masterList = json.data;
          localStorage.setItem('inspection_master_items', JSON.stringify(masterList));
          if (!isSilent) showToast(`商品マスタ取得完了 (${masterList.length}件)`);
        }
      } catch (e) { if (!isSilent) showToast('マスタ取得エラー'); }
    }

    async function refreshPLData(isSilent = false) {
      if (!state.gasUrl) return;
      try {
        const res = await fetch(`${state.gasUrl}?action=refreshPLData`);
        const json = await res.json();
        if (json.status === 'success' && Array.isArray(json.data)) {
          plProgress = json.data;
          renderPLList();
          if (!isSilent) showToast('PLデータを更新しました');
        }
      } catch (e) { if (!isSilent) showToast('PL反映エラー'); }
    }

    function renderPLList() {
      const container = document.getElementById('pl-list-container');
      container.innerHTML = '';
      if (plProgress.length === 0) {
        container.innerHTML = '<div class="col-span-2 text-center py-4 text-xs text-slate-400">PLデータがありません</div>';
        return;
      }
      plProgress.forEach(p => {
        const btn = document.createElement('button');
        btn.onclick = () => selectPL(p.plNo);
        btn.className = `p-3 rounded-2xl border text-left transition-all active:scale-95 ${p.isCompleted ? 'bg-slate-100 border-slate-200 opacity-60' : 'bg-white border-slate-300 hover:border-emerald-500 shadow-sm'}`;
        btn.innerHTML = `
          <div class="flex items-center justify-between"><span class="font-mono text-xs font-black">PL ${p.plNo}</span>${p.isCompleted ? '<span class="text-[9px] text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded font-bold">✓ 済</span>' : '<span class="text-[9px] text-sky-700 bg-sky-100 px-1.5 py-0.5 rounded font-bold">未検品</span>'}</div>
          <div class="text-[11px] text-slate-600 mt-1">${p.totalLines}品目 / 計${p.totalPlanQty}点</div>
        `;
        container.appendChild(btn);
      });
    }

    // ステップ遷移コントロール
    function goToStep(stepName) {
      state.currentStep = stepName;
      ['pl_select', 'counting', 'discrepancy_type', 'master_search', 'confirm'].forEach(s => {
        document.getElementById(`step-${s}`).classList.add('hidden');
      });
      document.getElementById(`step-${stepName}`).classList.remove('hidden');

      const backBtn = document.getElementById('header-back-btn');
      const plInfo = document.getElementById('header-pl-info');

      if (stepName === 'pl_select') {
        backBtn.classList.add('hidden');
        plInfo.classList.add('hidden');
      } else {
        backBtn.classList.remove('hidden');
        plInfo.classList.remove('hidden');
        plInfo.textContent = `· PL: ${state.selectedPL}`;
      }
    }

    // テンキー（PL選択用）
    function pressPlKey(num) { if (state.plKeypadBuffer.length < 6) state.plKeypadBuffer += num; updatePlDisplay(); }
    function clearPlKey() { state.plKeypadBuffer = ''; updatePlDisplay(); }
    function backspacePlKey() { state.plKeypadBuffer = state.plKeypadBuffer.slice(0, -1); updatePlDisplay(); }
    function updatePlDisplay() {
      const el = document.getElementById('pl-keypad-display');
      el.textContent = state.plKeypadBuffer || 'PL番号';
      el.className = state.plKeypadBuffer ? 'mt-1 h-16 bg-slate-50 border-2 border-slate-300 rounded-2xl flex items-center justify-center text-3xl font-black font-mono tracking-widest text-emerald-700' : 'mt-1 h-16 bg-slate-50 border-2 border-slate-300 rounded-2xl flex items-center justify-center text-3xl font-black font-mono tracking-widest text-slate-400';
    }
    function confirmPlInput() {
      if (!state.plKeypadBuffer) { alert('PL番号を入力してください'); return; }
      selectPL(state.plKeypadBuffer);
    }

    async function selectPL(plNo) {
      state.selectedPL = String(plNo).trim();
      let lines = [];
      if (state.gasUrl) {
        showToast('PL詳細を読込中...');
        try {
          const res = await fetch(`${state.gasUrl}?action=getPLDetails&plNo=${encodeURIComponent(state.selectedPL)}`);
          const json = await res.json();
          lines = json.data || [];
        } catch (e) {}
      }
      if (lines.length === 0) {
        alert(`PL「${state.selectedPL}」のデータが見つかりませんでした。`);
        return;
      }

      const masterMap = {};
      masterList.forEach(m => { masterMap[m.itemCode] = m; });

      currentPLItems = lines.map((l, idx) => {
        const m = masterMap[l.itemCode];
        return {
          id: `item-${idx}`,
          itemCode: l.itemCode,
          plNo: state.selectedPL,
          mexDesign: l.mexDesign,
          mexColor: l.mexColor,
          mexSize: l.mexSize,
          jpDesign: m ? m.jpDesign : l.jpDesign,
          jpColor: m ? m.jpColor : l.jpColor,
          jpSize: m ? m.jpSize : l.jpSize,
          planQty: l.planQty,
          actualQty: null,
          hasException: false,
          discrepancies: []
        };
      });

      currentIndex = 0;
      state.plKeypadBuffer = '';
      updatePlDisplay();
      loadCurrentCountingItem();
      goToStep('counting');
    }

    function loadCurrentCountingItem() {
      const it = currentPLItems[currentIndex];
      document.getElementById('count-item-index').textContent = `品目 ${currentIndex + 1} / ${currentPLItems.length}`;
      document.getElementById('count-pl-badge').textContent = `PL: ${state.selectedPL}`;
      document.getElementById('count-item-code').textContent = it.itemCode;
      document.getElementById('count-item-name').textContent = it.jpDesign;
      document.getElementById('count-item-color').textContent = it.jpColor || 'なし';
      document.getElementById('count-item-size').textContent = it.jpSize || 'FREE';
      document.getElementById('count-plan-qty').textContent = it.planQty;

      state.countKeypadBuffer = '';
      updateCountDisplay();
    }

    // テンキー（カウント入力用）
    function pressCountKey(num) { if (state.countKeypadBuffer.length < 5) state.countKeypadBuffer += num; updateCountDisplay(); }
    function clearCountKey() { state.countKeypadBuffer = ''; updateCountDisplay(); }
    function backspaceCountKey() { state.countKeypadBuffer = state.countKeypadBuffer.slice(0, -1); updateCountDisplay(); }
    function updateCountDisplay() {
      const el = document.getElementById('count-actual-qty-display');
      el.textContent = state.countKeypadBuffer !== '' ? state.countKeypadBuffer : '-';
    }

    function submitExactMatch() {
      const it = currentPLItems[currentIndex];
      it.actualQty = it.planQty;
      it.hasException = false;
      it.discrepancies = [];
      proceedNextItem();
    }

    function proceedFromCounting() {
      const val = state.countKeypadBuffer !== '' ? Number(state.countKeypadBuffer) : currentPLItems[currentIndex].planQty;
      currentPLItems[currentIndex].actualQty = val;
      if (val === currentPLItems[currentIndex].planQty) {
        submitExactMatch();
      } else {
        // 差異があるため、STEP 3（要因選択）へ分岐
        goToStep('discrepancy_type');
      }
    }

    function selectDiscrepancyType(type) {
      state.selectedDiscrepancyType = type;
      const it = currentPLItems[currentIndex];
      const qty = it.actualQty;

      if (type === '数量過不足') {
        it.hasException = true;
        it.discrepancies = [{ reason: '数量過不足', qty: qty, targetItemCode: '', targetItemName: '', targetSize: '', note: '' }];
        proceedNextItem();
      } else {
        // サイズ違い、商品違いの場合は商品検索画面（STEP 4）へ
        goToStep('master_search');
        filterMaster('');
      }
    }

    function filterMaster(query) {
      const q = (query || '').toLowerCase().trim();
      const container = document.getElementById('master-search-results');
      container.innerHTML = '';
      const filtered = masterList.filter(m => !q || m.itemCode.toLowerCase().includes(q) || m.jpDesign.toLowerCase().includes(q));
      
      filtered.forEach(m => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.onclick = () => selectMasterItem(m);
        btn.className = 'w-full text-left p-3 rounded-2xl bg-slate-50 hover:bg-slate-100 border border-slate-200 flex flex-col gap-0.5 active:scale-98';
        btn.innerHTML = `
          <div class="font-bold text-slate-900 text-xs">${m.jpDesign}</div>
          <div class="text-[11px] text-slate-600 flex items-center justify-between"><span>色: ${m.jpColor || 'なし'} · サイズ: <strong class="text-purple-700">${m.jpSize || 'FREE'}</strong></span><span class="font-mono">${m.itemCode}</span></div>
        `;
        container.appendChild(btn);
      });
    }

    function selectMasterItem(m) {
      const it = currentPLItems[currentIndex];
      it.hasException = true;
      it.discrepancies = [{
        reason: state.selectedDiscrepancyType,
        qty: it.actualQty,
        targetItemCode: m.itemCode,
        targetItemName: m.jpDesign,
        targetSize: m.jpSize,
        note: ''
      }];
      proceedNextItem();
    }

    function proceedNextItem() {
      currentIndex++;
      if (currentIndex < currentPLItems.length) {
        loadCurrentCountingItem();
        goToStep('counting');
      } else {
        // 全品目のカウント完了 ➔ STEP 5（確認画面）へ
        renderConfirmScreen();
        goToStep('confirm');
      }
    }

    function renderConfirmScreen() {
      document.getElementById('confirm-pl-label').textContent = `PL: ${state.selectedPL}`;
      const container = document.getElementById('confirm-items-container');
      container.innerHTML = '';
      let totalActual = 0;

      currentPLItems.forEach(it => {
        totalActual += (Number(it.actualQty) || 0);
        const isMatch = it.actualQty === it.planQty && !it.hasException;
        const div = document.createElement('div');
        div.className = `p-3 rounded-2xl border text-xs space-y-1 ${isMatch ? 'bg-emerald-50/50 border-emerald-300' : 'bg-amber-50/50 border-amber-300'}`;
        
        let subHtml = '';
        if (it.hasException && it.discrepancies.length > 0) {
          const disc = it.discrepancies[0];
          subHtml = `<div class="mt-1 p-2 bg-amber-100 rounded-xl text-amber-900 font-bold">⚠️ ${disc.reason}: ${disc.targetItemName || ''} ${disc.targetSize ? '(' + disc.targetSize + ')' : ''} (${disc.qty}点)</div>`;
        }

        div.innerHTML = `
          <div class="flex items-center justify-between">
            <div>
              <div class="font-bold text-slate-900 text-sm">${it.jpDesign}</div>
              <div class="text-[11px] text-slate-500">予定: ${it.planQty} ➔ 実績: <strong class="${isMatch ? 'text-emerald-700' : 'text-amber-700'} text-sm">${it.actualQty}</strong></div>
            </div>
            <span class="font-mono text-[10px] text-slate-400">${it.itemCode}</span>
          </div>
          ${subHtml}
        `;
        container.appendChild(div);
      });

      document.getElementById('confirm-total-actual').textContent = `${totalActual} 点`;
    }

    async function submitInspectionData() {
      const btn = document.getElementById('btn-final-submit');
      btn.disabled = true;
      btn.textContent = '送信中...';

      const payload = {
        action: 'submitInspection',
        sessionId: 'SES-' + Date.now(),
        inspectorName: state.workerName,
        plNo: state.selectedPL,
        items: currentPLItems,
        timestamp: new Date().toISOString()
      };

      try {
        if (!state.gasUrl) throw new Error('GAS URL未設定');
        const res = await fetch(state.gasUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (json.status !== 'success') throw new Error(json.message);

        showToast('検品結果を送信しました！');
        await refreshPLData(true);
        goToStep('pl_select');
      } catch (e) {
        alert('送信エラー: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '検品結果を送信して完了する ➔';
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.opacity = '1';
      toast.style.transform = 'translate(-50%, 0)';
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%, -8px)';
      }, 2400);
    }

    // 設定・作業者モーダル
    function openSettingsModal() { document.getElementById('modal-settings').classList.remove('hidden'); }
    function closeSettingsModal() { document.getElementById('modal-settings').classList.add('hidden'); }
    function saveSettings() {
      state.gasUrl = document.getElementById('setting-gas-url').value.trim();
      localStorage.setItem('inspection_gas_url', state.gasUrl);
      closeSettingsModal();
      showToast('設定を保存しました');
    }
    function openWorkerModal() { document.getElementById('modal-worker').classList.remove('hidden'); }
    function closeWorkerModal() { document.getElementById('modal-worker').classList.add('hidden'); }
    function saveWorkerQuick() {
      const name = document.getElementById('worker-quick-input').value.trim();
      if (!name) return;
      state.workerName = name;
      localStorage.setItem('inspection_worker', name);
      updateHeader();
      closeWorkerModal();
      showToast('作業者名を変更しました');
    }
    function openImporterModal() { alert('スプレッドシートの「PL取込」シートにExcelデータをそのまま貼り付けてください。'); }
  </script>
</body>
</html>
